<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D 闯关游戏</title>
    <style>
        :root{
            --bg:#000;
            --fg:#e6edf3;
            --muted:#9ca3af;
            --line:rgba(255,255,255,.6);
            --lineSoft:rgba(255,255,255,.25);
            --primary:#3b82f6;
            --danger:#ef4444;
        }
        * { box-sizing: border-box; }
        html, body { width: 100%; height: 100%; }
        body {
            margin: 0;
            font-family: Arial, "Microsoft YaHei", sans-serif;
            color: var(--fg);
            background: var(--bg);
            position: relative;
            overflow-x: hidden;
        }
        body::before {
            content: "";
            position: fixed;
            inset: -38vh -38vw;
            background: #000 url("./assets/images/login_bg_placeholder.jpg") center center / contain no-repeat;
            transform: rotate(-90deg);
            transform-origin: center center;
            z-index: -2;
            pointer-events: none;
        }
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.45);
            z-index: -1;
            pointer-events: none;
        }
        .overlayDim {
            min-height: 100vh;
            background: rgba(0,0,0,.45);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .authShell {
            width: min(560px, calc(100vw - 28px));
            border: 1px solid var(--line);
            border-radius: 14px;
            background: transparent;
            padding: 16px 18px 20px;
        }
        .authTabs { display: flex; gap: 8px; margin-bottom: 14px; }
        .tabBtn {
            flex: 1;
            height: 46px;
            border-radius: 10px;
            border: 1px solid var(--line);
            background: transparent;
            color: var(--fg);
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
        }
        .tabBtn.active { background: rgba(59,130,246,.25); border-color: #93c5fd; }
        .field { display:flex; flex-direction:column; gap: 6px; margin: 12px 0; }
        .field label { color: #d1d5db; font-size: 13px; }
        .field input {
            height: 44px;
            border-radius: 10px;
            border: 1px solid var(--lineSoft);
            background: rgba(0,0,0,.32);
            color: var(--fg);
            padding: 0 12px;
            font-size: 14px;
        }
        .row { display:flex; gap: 10px; flex-wrap: wrap; }
        .btn {
            appearance:none;
            border: 1px solid var(--lineSoft);
            border-radius: 10px;
            height: 44px;
            padding: 0 16px;
            cursor:pointer;
            color:#fff;
            font-weight:700;
            background: rgba(59,130,246,.9);
        }
        .btn.ghost { background: transparent; }
        .hint { font-size: 12px; color: var(--muted); margin-top: 8px; }
        #authError { color: #fca5a5; margin-top: 10px; display: none; }

        #app { display:none; min-height: 100vh; }
        .mainCenter {
            min-height: 100vh;
            display:flex;
            align-items:center;
            justify-content:flex-start;
            padding: 24px 24px 24px 56px;
        }
        .menuStack {
            width: min(420px, 90vw);
            display:flex;
            flex-direction:column;
            gap: 14px;
        }
        .menuBtn {
            height: 56px;
            border-radius: 12px;
            border: 1px solid var(--line);
            background: rgba(15,23,42,.56);
            color: #fff;
            font-size: 20px;
            font-weight: 800;
            cursor: pointer;
        }
        .menuBtn.exit { border-color: rgba(239,68,68,.9); background: rgba(127,29,29,.55); }

        .panelShell {
            display:none;
            min-height: 100vh;
            padding: 20px 20px 20px 56px;
        }
        /* 关卡游玩时：画面居中显示（避免整体偏左） */
        #panelLevels.isPlaying{
            padding-left: 20px;
            padding-right: 20px;
        }
        .backBtn {
            width: 44px;
            height: 44px;
            border-radius: 999px;
            border: 1px solid var(--line);
            background: rgba(0,0,0,.32);
            color:#fff;
            font-size: 24px;
            line-height: 1;
            cursor:pointer;
        }
        .panelTitle { margin: 16px 0 14px; font-size: 24px; }
        .levelsGrid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 12px;
            width: min(900px, 96vw);
        }
        .levelCell {
            min-height: 92px;
            border-radius: 12px;
            border: 1px solid var(--lineSoft);
            background: rgba(15,23,42,.45);
            color:#fff;
            font-weight:700;
            cursor:pointer;
        }
        .levelCell.locked { opacity: .4; filter: grayscale(1); cursor: not-allowed; }
        .settingsCard {
            border: 1px solid var(--line);
            border-radius: 14px;
            background: rgba(0,0,0,.35);
            width: min(640px, 95vw);
            padding: 16px;
        }
        .sliderRow { display:flex; align-items:center; gap: 12px; }
        input[type="range"]{ width: min(440px, 80vw); }
        .divider{ height:1px; background: var(--lineSoft); margin: 14px 0; }
        .settingsGrid{
            display:grid;
            grid-template-columns: 120px 1fr auto;
            gap: 10px 12px;
            align-items:center;
            margin-top: 10px;
        }
        .keyBox{
            height: 42px;
            border-radius: 10px;
            border: 1px solid var(--lineSoft);
            background: rgba(0,0,0,.28);
            color: var(--fg);
            padding: 0 10px;
            font-size: 13px;
        }
        .miniBtn{
            height: 42px;
            padding: 0 12px;
            border-radius: 10px;
            border: 1px solid var(--lineSoft);
            background: rgba(59,130,246,.25);
            color: var(--fg);
            font-weight: 800;
            cursor: pointer;
            white-space: nowrap;
        }
        #gameHost {
            margin-top: 16px;
            border: 1px solid var(--lineSoft);
            border-radius: 12px;
            padding: 8px;
            display:none;
            background: rgba(0,0,0,.12);
            position: relative;
        }
        #phaserMount {
            position: relative;
            display:flex;
            justify-content:center;
            align-items:center;
            /* 游戏区域不需要占满，限制最大宽度更利于居中与观感 */
            width: min(1100px, 92vw);
            height: clamp(500px, 72vh, 820px);
            margin: 0 auto;
        }
        #panelLevels.isPlaying #gameHost { display:flex; justify-content:center; margin-top: 18px; }
        #panelLevels.isPlaying #phaserMount { align-items:center; }
        #panelLevels { position: relative; }
        #levelToolbar{
            position:absolute;
            top: 10px;
            left:0;
            right:0;
            display:flex;
            justify-content:center;
            gap: 12px;
            pointer-events:none;
        }
        #levelToolbar > button{
            width: 52px;
            height: 52px;
            pointer-events:auto;
            font-size: 22px;
            padding: 0;
        }
        #panelLevels.isPlaying #levelToolbar{ display:flex; }
        canvas { display:block; margin: 0 auto; border-radius: 10px; }
        #mobileControls{
            position:absolute;
            inset: 0;
            pointer-events:none;
            display:none;
            z-index: 30;
        }
        #mobileControls.active{ display:block; }
        .mobilePad{
            position:absolute;
            pointer-events:auto;
            user-select:none;
            -webkit-user-select:none;
            touch-action: none;
            width: 64px;
            height: 64px;
            border-radius: 999px;
            border: 2px solid rgba(255,255,255,.9);
            background: rgba(15,23,42,.82);
            color:#fff;
            font-size: 30px;
            font-weight: 900;
            display:flex;
            align-items:center;
            justify-content:center;
        }
        .mobilePad:active{
            background: rgba(59,130,246,.88);
            border-color: rgba(255,255,255,1);
        }
        #mcLeft{ left: 18px; bottom: 18px; }
        #mcRight{ left: 92px; bottom: 18px; }
        #mcJump{ right: 20px; bottom: 18px; width: 78px; height: 78px; font-size: 24px; }
        /* Win dialog */
        #winDialogBackdrop{
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.55);
            display:none;
            align-items:center;
            justify-content:center;
            z-index: 50;
            padding: 18px;
        }
        #winDialog{
            width: min(520px, calc(100vw - 28px));
            border: 1px solid var(--line);
            border-radius: 14px;
            background: rgba(15,23,42,.92);
            box-shadow: 0 18px 60px rgba(0,0,0,.55);
            padding: 16px;
        }
        #winDialog h3{ margin: 0 0 10px; font-size: 20px; }
        #winDialog p{ margin: 0 0 14px; color: #e5e7eb; line-height: 1.55; }
        #winDialog .row{ justify-content:flex-end; }

        /* Pause overlay */
        #pauseBackdrop{
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.55);
            display:none;
            align-items:center;
            justify-content:center;
            z-index: 60;
            padding: 18px;
        }
        #pauseDialog{
            width: min(520px, calc(100vw - 28px));
            border: 1px solid var(--line);
            border-radius: 14px;
            background: rgba(15,23,42,.92);
            box-shadow: 0 18px 60px rgba(0,0,0,.55);
            padding: 16px;
        }
        #pauseDialog h3{ margin: 0 0 10px; font-size: 20px; }
        #pauseDialog p{ margin: 0 0 14px; color: #e5e7eb; line-height: 1.55; }
        #pauseDialog .row{ justify-content:flex-end; }
    </style>
</head>
<body>
<div id="landing" class="overlayDim">
    <div class="authShell">
        <div class="authTabs">
            <button id="tabLogin" class="tabBtn active" type="button">登录</button>
            <button id="tabRegister" class="tabBtn" type="button">注册</button>
        </div>
        <div id="loginForm">
            <div class="field">
                <label>用户名</label>
                <input id="loginUsername" maxlength="64" placeholder="例如：tom"/>
            </div>
            <div class="field">
                <label>密码</label>
                <input id="loginPassword" type="password" maxlength="72" placeholder="至少 6 位"/>
            </div>
            <div class="row">
                <button id="btnLogin" class="btn" type="button">登录</button>
            </div>
        </div>
        <div id="registerForm" style="display:none;">
            <div class="field">
                <label>用户名</label>
                <input id="regUsername" maxlength="64" placeholder="至少 3 位"/>
            </div>
            <div class="field">
                <label>密码</label>
                <input id="regPassword" type="password" maxlength="72" placeholder="至少 6 位"/>
            </div>
            <div class="row">
                <button id="btnRegister" class="btn" type="button">注册</button>
            </div>
        </div>
        <div id="authError"></div>
        <div class="hint">背景图已加载为全屏横向展示（保持整图优先）。</div>
    </div>
</div>

<div id="app">
    <section id="panelMenu" class="mainCenter">
        <div class="menuStack">
            <button id="navSingle" class="menuBtn" type="button">单人闯关</button>
            <button id="navCoop" class="menuBtn" type="button">双人闯关</button>
            <button id="navRace" class="menuBtn" type="button">双人竞速</button>
            <button id="navSettings" class="menuBtn" type="button">设置</button>
            <button id="navLogout" class="menuBtn exit" type="button">退出</button>
        </div>
    </section>

    <section id="panelLevels" class="panelShell">
        <button id="btnBackFromLevels" class="backBtn" type="button" title="返回">←</button>
        <div id="levelToolbar" aria-label="关卡控制按钮" style="display:none;">
            <button id="btnPauseLevel" class="menuBtn" type="button" title="暂停">||</button>
            <button id="btnExitLevel" class="menuBtn exit" type="button" title="退出">×</button>
        </div>
        <h2 id="levelsTitle" class="panelTitle">关卡选择</h2>
        <div id="levelsGrid" class="levelsGrid"></div>
        <div id="gameHost">
            <div id="phaserMount"></div>
            <div id="mobileControls" aria-label="手机端按键">
                <button id="mcLeft" class="mobilePad" type="button" aria-label="向左">←</button>
                <button id="mcRight" class="mobilePad" type="button" aria-label="向右">→</button>
                <button id="mcJump" class="mobilePad" type="button" aria-label="跳跃">跳</button>
            </div>
        </div>
    </section>

    <section id="panelSettings" class="panelShell">
        <button id="btnBackFromSettings" class="backBtn" type="button" title="返回">←</button>
        <h2 class="panelTitle">设置</h2>
        <div class="settingsCard">
            <div class="sliderRow">
                <div style="min-width:72px;">音量</div>
                <input id="volumeSlider" type="range" min="0" max="100" value="70"/>
                <div id="volumeValue" style="width:46px; text-align:right;">70</div>
            </div>
            <div class="hint">音量会实时控制背景音乐与点击音效，并自动保存。</div>

            <div class="divider"></div>
            <div style="font-weight:900; margin-bottom: 6px;">键位设置（双人竞速）</div>
            <div class="hint">点击“绑定”后按下一个键（如：A / D / W / ← / → / 空格）。</div>
            <div class="divider"></div>
            <div style="font-weight:900; margin-bottom: 6px;">操作方式</div>
            <div class="row">
                <label for="controlModeSelect" style="min-width:72px; display:flex; align-items:center;">模式</label>
                <select id="controlModeSelect" class="keyBox" style="min-width:220px;">
                    <option value="desktop">电脑端（键盘）</option>
                    <option value="mobile">手机端（屏幕按键）</option>
                </select>
            </div>
            <div class="hint">手机端会在关卡左下角显示左右键，右下角显示跳跃键。</div>

            <div style="margin-top: 10px; font-weight:800;">玩家 1</div>
            <div class="settingsGrid" aria-label="玩家1键位">
                <div>左</div><input id="kbP1Left" class="keyBox" readonly /><button id="btnBindP1Left" class="miniBtn" type="button">绑定</button>
                <div>右</div><input id="kbP1Right" class="keyBox" readonly /><button id="btnBindP1Right" class="miniBtn" type="button">绑定</button>
                <div>跳</div><input id="kbP1Jump" class="keyBox" readonly /><button id="btnBindP1Jump" class="miniBtn" type="button">绑定</button>
            </div>

            <div style="margin-top: 12px; font-weight:800;">玩家 2</div>
            <div class="settingsGrid" aria-label="玩家2键位">
                <div>左</div><input id="kbP2Left" class="keyBox" readonly /><button id="btnBindP2Left" class="miniBtn" type="button">绑定</button>
                <div>右</div><input id="kbP2Right" class="keyBox" readonly /><button id="btnBindP2Right" class="miniBtn" type="button">绑定</button>
                <div>跳</div><input id="kbP2Jump" class="keyBox" readonly /><button id="btnBindP2Jump" class="miniBtn" type="button">绑定</button>
            </div>

            <div class="row" style="margin-top: 12px;">
                <button id="btnResetKeybinds" class="btn ghost" type="button">恢复默认键位</button>
            </div>
        </div>
    </section>

    <div style="display:none;">
        <div id="meText"></div>
    </div>
</div>

<div id="winDialogBackdrop" role="dialog" aria-modal="true" aria-label="通关提示">
    <div id="winDialog">
        <h3 id="winDialogTitle">通关</h3>
        <p id="winDialogMsg">下一步？</p>
        <div class="row">
            <button id="btnWinExit" class="btn ghost" type="button">退出</button>
            <button id="btnWinNext" class="btn" type="button">下一关</button>
        </div>
    </div>
</div>

<div id="pauseBackdrop" role="dialog" aria-modal="true" aria-label="暂停提示">
    <div id="pauseDialog">
        <h3>已暂停</h3>
        <p>点击“继续游戏”返回关卡。</p>
        <div class="row">
            <button id="btnResumeLevel" class="btn" type="button">继续游戏</button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>

<script src="./levels/race5.js?v=20260416b"></script>

<script src="./levels/team3.js?v=20260413a"></script>

</body>
</html>
