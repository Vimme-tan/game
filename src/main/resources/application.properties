spring.application.name=Practical_training

# Server
server.port=8080

# MySQL (use environment variables to avoid hardcoding secrets)
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/game?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8}
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MyBatis
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.mapper-locations=classpath:mapper/**/*.xml

# Flyway migration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
